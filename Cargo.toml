[package]
name = "skilled"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
description = "Inspect and safely manage global coding-agent skills"
license = "MIT"
repository = "https://github.com/brian-bell/skilled"
homepage = "https://github.com/brian-bell/skilled"
readme = "README.md"
publish = false
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/src/**",
]

[[bin]]
name = "skilled"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
directories = "6.0.0"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10.0"
thiserror = "2.0.19"

# Already in every build's dependency tree (rusqlite's bundled SQLite sits on
# it); promoted to a direct dependency for `fchdir(2)` and the `open(2)` flag
# constants behind `git::RepositoryHandle`, whose values are per-kernel and
# per-architecture ABI facts that must not be transcribed by hand.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The Windows counterpart of the libc promotion above, for the repair's
# handle-bound proven removal (`operations::remove_proven_directory_symlink`):
# `DeviceIoControl(FSCTL_GET_REPARSE_POINT)` and
# `SetFileInformationByHandle(FileDispositionInfoEx)` have no std spelling,
# and their constants and structures are ABI facts that must not be
# transcribed by hand. Microsoft's generated declarations, no transitive
# code of its own, compiled only for Windows targets.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[dev-dependencies]
insta = "1.48.0"
serde_json = "1.0"
tempfile = "3.27.0"
