[package]
name = "skilled"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
description = "Inspect and safely manage global coding-agent skills"
license = "MIT"
repository = "https://github.com/brian-bell/skilled"
homepage = "https://github.com/brian-bell/skilled"
readme = "README.md"
publish = false
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/src/**",
]

[[bin]]
name = "skilled"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
directories = "6.0.0"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10.0"
thiserror = "2.0.19"

[dev-dependencies]
insta = "1.48.0"
tempfile = "3.27.0"
